<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shell</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section id="openingScreen">

            <h1>ANYTHING NEW???</h1>

            <div id="openingButtons">

                <button id="yesButton" type="button">YES</button>
                <button id="noButton" type="button">NO</button>

            </div>

        </section>


        <section id="captureScreen">

            <h2>What's new?</h2>

            <textarea id="thoughtInput" autofocus></textarea>

            <button id="saveButton" type="button">SAVE</button>

            <p id="savedMessage">SAVED ✓</p>

        </section>

        <section id="reviewScreen">

    <h2>WHAT TO DO</h2>

    <div id="coinMeter">◉ 0</div>

    <div id="entryList"></div>

    <button id="backButton" type="button">BACK</button>

</section>

    </main>


    <script src="app.js"></script>

</body>
</html>
